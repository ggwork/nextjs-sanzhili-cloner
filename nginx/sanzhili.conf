# Nginx 反向代理配置 — sanzhili-pm.com
#
# 使用方法:
#   1. 复制到服务器: /etc/nginx/conf.d/sanzhili.conf
#   2. 将域名和证书路径替换为实际值
#   3. nginx -t && systemctl reload nginx
#
# SSL 证书申请 (Let's Encrypt 免费证书):
#   certbot --nginx -d www.sanzhili-pm.com -d sanzhili-pm.com

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name sanzhili-pm.com www.sanzhili-pm.com;

    # Let's Encrypt 证书续签验证 (certbot 会自动添加，预留位置)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name sanzhili-pm.com www.sanzhili-pm.com;

    # --- SSL 证书 ---
    # Let's Encrypt 默认路径 (certbot 自动生成)
    ssl_certificate     /etc/letsencrypt/live/sanzhili-pm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanzhili-pm.com/privkey.pem;

    # --- SSL 安全配置 ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: 强制浏览器始终使用 HTTPS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- 反向代理到 Docker 容器 ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 支持 (Next.js HMR / 热更新)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置 (邮件发送可能需要较长时间)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- 静态资源缓存 ---
    # Next.js _next/static 文件带 hash，可长期缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # public 目录下的图片/视频等静态资源
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|mp4|webm|css|js|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --- 安全头 ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 上传大小限制 ---
    # 联系表单数据量小，10MB 足够
    client_max_body_size 10m;

    # --- 日志 ---
    access_log /var/log/nginx/sanzhili.access.log;
    error_log  /var/log/nginx/sanzhili.error.log warn;

    # --- www -> 裸域重定向 (可选) ---
    # 如果主域名是 sanzhili-pm.com，将 www 重定向到裸域
    # 如果主域名是 www.sanzhili-pm.com，则反过来
    if ($host = www.sanzhili-pm.com) {
        return 301 https://sanzhili-pm.com$request_uri;
    }
}

# --- gzip 压缩 (放在 nginx.conf 的 http {} 块中，或此处 include) ---
# 如果 nginx.conf 中已配置 gzip，可忽略以下内容
# gzip on;
# gzip_comp_level 6;
# gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
